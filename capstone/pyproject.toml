[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/rcghpge/capstone"

[project]
name = "capstone"
version = "0.4.0"
description = "Machine learning utilizing key health indicators for infant mortality rate prediction. University of Texas at Arlington."
authors = [
  { name = "Robert Cocker"}, 
  { email = "rcocker87@gmail.com"}
]
license = "BSD-3-Clause OR MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab",
    "ipykernel",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "scipy",
    "joblib",
    "seaborn",
    "matplotlib",
    "plotly",
    "jupyterlab-widgets>=3.0.16,<4",
    "fonttools", 
    "urllib3",
    "keras>=3.13.1,<4"
, "pytest>=9.0.2,<10", "pytest-cov>=7.0.0,<8", "nbval>=0.11.0,<0.12", "black>=26.1.0,<27", "flake8>=7.3.0,<8", "bandit>=1.9.3,<2", "pip-audit>=2.10.0,<3", "pre-commit>=4.5.1,<5", "jupyterlab-lsp>=5.2.0,<6", "pip-tools>=7.5.2,<8", "build>=1.4.0,<2"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov", "nbval",
    "black>=23.0", "flake8",
    "bandit>=1.7", "pip-audit>=2.7",
    "pre-commit", "jupyterlab-lsp",
    "pip-tools", "build>=1.4.0"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
capstone = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
catboost = ">=1.2.8,<2"
xgboost = ">=3.1.3,<4"
pandas = ">=3.0.0,<4"
numpy = ">=2.4.1,<3"
scikit-learn = ">=1.8.0,<2"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
python = ">=3.14.2,<3.15"
jupyterlab = ">=4.5.3,<5"
ipykernel = ">=7.1.0,<8"
jax = ">=0.7.2,<0.8"
jaxlib = ">=0.7.2,<0.8"
