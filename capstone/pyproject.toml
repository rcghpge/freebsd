[project]
name = "capstone"
version = "0.1.1"
description = "Capstone Project. FreeBSD development branch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "pandas>=2.3.3",
    "numpy>=2.4.1",
    "scikit-learn>=1.8",
    "xgboost>=3.1.3",
    "scipy>=1.11",
    "joblib>=1.3",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "plotly>=5.17",
    "jupyterlab-widgets",
    "fonttools>=4.61.0", 
    "urllib3>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov", "nbval",
    "black>=23.0", "flake8",
    "bandit>=1.7", "pip-audit>=2.7",
    "pre-commit", "jupyterlab-lsp",
    "pip-tools"
]
